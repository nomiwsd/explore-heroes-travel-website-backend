# Explore Heroes — single public entry point.
#
#   /api/*, /admin/module/*, /sanctum/*   → Laravel (php-fpm in `app`)
#   /module/*                             → Laravel /api/module/*
#   /uploads/*, /storage/*                → media files from the shared volumes
#   everything else                       → Next.js (`frontend:3000`)
#
# Serving the API and media from the site's own domain avoids mixed content
# once the site is on HTTPS (sheet item SE-02). For TLS see
# docker/nginx/ssl.conf.example.

# Resolve container names at request time so nginx starts even if a
# dependency is restarting.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    client_max_body_size 64m;
    large_client_header_buffers 4 32k;
    client_header_buffer_size 16k;
    server_tokens off;

    set $php_upstream app:9000;
    set $next_upstream http://frontend:3000;

    # Let's Encrypt HTTP-01 challenges (see ssl.conf.example)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ----- Laravel ---------------------------------------------------------
    location ~ ^/(api|admin/module|sanctum|broadcasting)(/|$) {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location ^~ /module/ {
        rewrite ^/module/(.*)$ /api/module/$1 last;
    }

    # ----- Media -----------------------------------------------------------
    location ^~ /uploads/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # ----- Next.js ---------------------------------------------------------
    location / {
        proxy_pass $next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS flag for PHP when TLS terminates here (empty on plain HTTP).
map $scheme $fastcgi_https {
    default '';
    https   on;
}
